services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: flipkartdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8082:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: